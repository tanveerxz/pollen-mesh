[project]
name = "pollen-mesh-agent"
version = "0.1.1"
description = "Triage your own security log locally and share only a stripped, hashed signature — so cross-organization threat correlation never requires handing over raw telemetry."
license = { file = "LICENSE" }
readme = "README.md"
# Must not be wider than flwr's own floor (>=3.11,<4.0), or uv fails to resolve
# on the runner: a wider range forces resolution for Python versions flwr
# doesn't support.
requires-python = ">=3.11,<4.0"
dependencies = [
    "flwr>=1.35.0,<2.0",
    "requests>=2.31.0",
]

[tool.flwr.app]
# Must match the Flower account username used for `flwr login supergrid`.
publisher = "tanveer"
display-name = "Pollen Mesh Agent"
flwr-version-target = "1.35.0"

[tool.flwr.app.components]
agentapp = "pollen_mesh_agent.agent:app"

[tool.flwr.app.config.agent]
# Identifies this organization in submitted signatures. Override per deployment.
org_id = "my-org"
# The log this agent is allowed to read. It reads nothing else, ever.
log_path = "data/mock_log.jsonl"
# Where that log comes from. Blank means "use log_path as JSONL". Forms:
#   jsonl:<path>              one JSON object per line
#   file:<path>               plain text, one event per line
#   winevent:<channel>        the live Windows Event Log
# e.g. log_source = "winevent:Windows PowerShell"
log_source = ""
# For winevent only: which event ids to read, and how many. 400/403 carry the
# full command line on any stock Windows host, with no logging policy enabled.
log_event_ids = "400,403,4104"
log_max_events = 40
# Where stripped signatures are submitted. Point this at your own correlator.
server_url = "http://localhost:8000/api/signatures"
# Any Open-Responses-compatible model reachable from the SuperLink.
model = "/models/Kimi-K2.7-Code"
