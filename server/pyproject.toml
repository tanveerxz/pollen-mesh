[project]
name = "pollen-server"
version = "0.1.0"
description = "Pollen Mesh correlation server — sole owner of shared state and matching logic"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# `server/` is the project root and `server/server/` the package, so the tests
# need the project root on the path to import it.
pythonpath = ["."]
testpaths = ["tests"]
